[project]
name = "binary-precision"
version = "0.2.0"
description = "High-accuracy declarative binary read/write using Construct"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["construct>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
binary-precision = "binary_precision.cli:main"

[tool.setuptools.packages.find]
include = ["binary_precision*"]
exclude = ["evals*", "references*", "examples*", "tests*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
